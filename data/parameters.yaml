# Default harvesting, drying, economic and LCIA parameter sets.
# Values are literature-typical placeholders. EDIT and cite your sources.

harvesting:
  - name: Settling + centrifugation
    recovery: 0.90          # fraction of biomass recovered
    elec_kwh_per_kg: 1.3    # per kg dry biomass processed
    final_solids: 0.20      # solids fraction of the concentrate (0-1)
    notes: "Gravity/flocculation pre-concentration then disc-stack centrifuge."

  - name: Centrifugation only
    recovery: 0.95
    elec_kwh_per_kg: 3.5
    final_solids: 0.22
    notes: "Single-step centrifugation; higher recovery, higher energy."

  - name: Membrane filtration
    recovery: 0.93
    elec_kwh_per_kg: 0.8
    final_solids: 0.15
    notes: "Lower energy; membrane fouling / replacement not costed here."

  # Micro-screen used commercially to harvest filamentous Spirulina (filaments
  # 20-100 um long, >25 um retained). Padi et al. 2023 VFS reached 14.75% DM;
  # Enzweiler et al. review: Spirulina 8-10% TSS, microstrainer ~0.2 kWh/m3.
  - name: Vibrating screen filter
    recovery: 0.90
    elec_kwh_per_kg: 0.2      # micro-screen; among the lowest-energy harvesters
    final_solids: 0.15        # ~14.75% DM (Padi et al. 2023, VFS)
    notes: "Cheapest harvest for filamentous Spirulina/cyanobacteria; filtrate recycled to pond. Not for small unicellular algae (<25 um)."

  # Rotary drum vacuum filter: straining fabric on a rotating drum with backwash.
  # Suited to large/filamentous algae; Enzweiler et al. review: non-precoat vacuum
  # drum on Coelastrum reached ~18% DM (CF~180). Not effective on small unicellulars.
  - name: Rotary drum filter
    recovery: 0.90
    elec_kwh_per_kg: 1.5      # moderate; below disc-stack centrifugation (~3.5)
    final_solids: 0.18        # cake ~18% DM
    notes: "Vacuum drum filtration for filamentous/large algae (e.g. Spirulina, Micractinium); frequent backwash; poor for <10 um unicellular strains."

  # Tangential (cross-flow) membrane filtration. The feed flows parallel to the
  # membrane so the shear sweeps cells off the surface and limits fouling. Very
  # low energy as a *pre-concentration* step (~0.4-2 kWh/m3 broth), retains
  # soluble proteins/pigments and is gentle on shear-sensitive strains, but alone
  # reaches only ~2-8% DM, so a centrifuge/press polish usually follows.
  # Bilad/Fasaei: 0.1-0.7 kWh/kg for closed-system dewatering; membrane pre-conc.
  # + centrifuge is among the lowest-cost harvest trains.
  - name: Cross-flow ultrafiltration (tangential)
    recovery: 0.95
    elec_kwh_per_kg: 0.4      # low-energy pre-concentration; among the cheapest
    final_solids: 0.08        # membrane alone ~2-8% DM (needs a polish step to go higher)
    notes: "Tangential-flow UF pre-concentration: low energy, retains solubles, gentle on cells; fouling/membrane replacement not costed here. Follow with a centrifuge/press for high solids."

  - name: Cross-flow membrane + centrifuge (2-stage)
    recovery: 0.95
    elec_kwh_per_kg: 1.0      # UF pre-concentration then disc-stack polish
    final_solids: 0.22        # centrifuge polish lifts the UF concentrate to a paste
    notes: "Two-stage train (Fasaei et al. 2018): cross-flow membrane cuts the volume the centrifuge must process, lowering combined energy vs centrifugation alone."

# --- Downstream extraction / fractionation presets ----------------------------
# Catalogued unit operations for the biorefinery extraction step. Each preset is
# an `Extraction` config with flows per kg of DRY biomass entering the step
# (disruption elec, extraction elec, solvent-recovery heat, solvent make-up and
# equipment CAPEX). Numbers are literature-typical; edit and cite for your case.
# The solvent make-up (net of recycle) carries the solvent's cradle-to-gate GWP
# and CED into the LCA and its price into the TEA. For supercritical CO2 the
# "solvent" is the CO2 itself (recycled >98%, so a small net make-up).
downstream:
  - name: Hexane solvent extraction (lipids)
    disruption_elec_kwh_per_kg: 0.5   # bead mill / homogeniser pre-treatment
    elec_kwh_per_kg: 0.3              # extraction + phase separation
    heat_mj_per_kg: 1.5               # solvent recovery (distillation)
    solvent_name: Hexane
    solvent_kg_per_kg: 5.0            # solvent contacted per kg biomass (S/F 3-20:1)
    solvent_recovery: 0.98
    solvent_price: 1.5                # EUR/kg
    solvent_gwp: 0.9                  # kg CO2-eq/kg (ecoinvent "market for hexane")
    solvent_ced: 55.0                 # MJ/kg
    capex_per_kgyr: 1.0
    notes: "Classic non-polar lipid extraction; cheapest solvent, high selectivity, low latent heat aids recovery. Not food-grade (residual-solvent limits). Frontiers Energy Res. 2014 review; Ramírez-Verduzco/ecoinvent."

  - name: Ethanol extraction (food-grade)
    disruption_elec_kwh_per_kg: 0.5
    elec_kwh_per_kg: 0.4
    heat_mj_per_kg: 2.5               # higher latent heat than hexane
    solvent_name: Ethanol
    solvent_kg_per_kg: 6.0
    solvent_recovery: 0.98
    solvent_price: 1.0
    solvent_gwp: 1.6                  # petro-ethanol ~1.5-2.5; bio-ethanol lower
    solvent_ced: 45.0
    capex_per_kgyr: 2.0
    notes: "GRAS solvent for food/nutraceutical lipids & pigments (e.g. carotenoids). Greener footprint per kg but more solvent-recovery heat. Aslanbay Guler et al. 2024 (ChemBioEng Rev.)."

  - name: Supercritical CO2 extraction
    disruption_elec_kwh_per_kg: 0.5   # optional milling of dry biomass
    elec_kwh_per_kg: 3.0              # CO2 compression/recompression (dominant load)
    heat_mj_per_kg: 0.5
    solvent_name: CO2 (supercritical)
    solvent_kg_per_kg: 40.0           # high solvent-to-feed, but recycled >98%
    solvent_recovery: 0.98            # net make-up ~0.8 kg CO2/kg biomass
    solvent_price: 0.10
    solvent_gwp: 0.5                  # capture + compression of make-up CO2
    solvent_ced: 8.0
    capex_per_kgyr: 10.0             # high-pressure vessels (20-45 MPa) dominate CAPEX
    notes: "Solvent-free product, ideal for high-value labile actives (astaxanthin, EPA/DHA, pigments); typically 5-10% v/v ethanol co-solvent for polar compounds. Higher energy offset by near-zero solvent cost. Molecules 2023 review 10.3390/molecules28031410; de Melo et al. 2014."

  - name: Bead-milling + aqueous extraction (protein)
    disruption_elec_kwh_per_kg: 1.0   # optimised bead mill (0.45-2 kWh/kg)
    elec_kwh_per_kg: 1.5              # centrifugal clarification + concentration
    heat_mj_per_kg: 0.0
    solvent_name: Water
    solvent_kg_per_kg: 0.0
    solvent_recovery: 1.0
    solvent_price: 0.0
    solvent_gwp: 0.0
    solvent_ced: 0.0
    capex_per_kgyr: 3.0
    notes: "Solvent-free aqueous route to soluble protein: bead-mill disruption then aqueous phase separation. Postma et al. 2015 (Bioresour. Technol.): 0.45-2 kWh/kg optimised bead milling; HPH alternative 0.5-5.4 kWh/kg."

  - name: Bead-milling + ultrafiltration (protein isolate)
    disruption_elec_kwh_per_kg: 1.0
    elec_kwh_per_kg: 2.5              # tangential UF / diafiltration of the extract
    heat_mj_per_kg: 0.0
    solvent_name: Water
    solvent_kg_per_kg: 0.0
    solvent_recovery: 1.0
    solvent_price: 0.0
    solvent_gwp: 0.0
    solvent_ced: 0.0
    capex_per_kgyr: 4.0
    notes: "Disruption then tangential ultrafiltration/diafiltration to concentrate & purify soluble protein into an isolate; membrane replacement not costed. TFF energy 0.4-2 kWh/m3 (Bilad et al.); membrane dewatering reviews."

  - name: Extraction + chromatographic purification (pigment)
    disruption_elec_kwh_per_kg: 1.0
    elec_kwh_per_kg: 2.0
    heat_mj_per_kg: 3.0
    solvent_name: Water/buffer
    solvent_kg_per_kg: 0.0
    solvent_recovery: 1.0
    solvent_price: 0.0
    solvent_gwp: 0.0
    solvent_ced: 0.0
    capex_per_kgyr: 15.0             # chromatography + labour-intensive purification
    notes: "High-purity aqueous pigment route (e.g. C-phycocyanin): buffer extraction then membrane/chromatographic polishing. High CAPEX, low yield. van der Walt et al. 2025."

drying:
  - name: Spray drying
    enabled: true
    final_solids: 0.95
    thermal_mj_per_kg_water: 3.6   # MJ heat per kg water evaporated
    elec_kwh_per_kg: 0.3
    fuel: natural_gas
    notes: "Free-flowing powder; energy-intensive; good product quality."

  - name: Drum drying
    enabled: true
    final_solids: 0.93
    thermal_mj_per_kg_water: 3.2
    elec_kwh_per_kg: 0.2
    fuel: natural_gas
    notes: "Cheaper than spray drying; flakes."

  - name: No drying (wet paste)
    enabled: false
    final_solids: 0.20
    thermal_mj_per_kg_water: 0.0
    elec_kwh_per_kg: 0.0
    fuel: natural_gas
    notes: "Product delivered as wet paste; no thermal drying."

# Single default economic parameter set.
economics:
  electricity_price: 0.15      # EUR/kWh
  heat_price: 0.030            # EUR/MJ (natural-gas thermal)
  co2_price: 0.05              # EUR/kg CO2 supplied (set 0 or negative for waste/credited CO2)
  bicarbonate_price: 0.28      # EUR/kg NaHCO3 (sodium bicarbonate carbon source; Padi et al. 2023)
  nitrogen_price: 1.2          # EUR/kg N
  phosphorus_price: 3.0        # EUR/kg P
  water_price: 0.5             # EUR/m3
  substrate_price: 0.5         # EUR/kg glucose
  land_price: 5.0              # EUR/m2 (one-time purchase)
  harvest_capex_per_kgyr: 2.0  # EUR per (kg/yr) annual capacity
  drying_capex_per_kgyr: 1.5   # EUR per (kg/yr) annual capacity
  installation_factor: 2.5     # installed CAPEX = equipment CAPEX * factor
  indirect_factor: 0.30        # engineering + contingency, as fraction of installed CAPEX
  labor_cost_per_year: 250000  # EUR/yr total labour
  maintenance_frac: 0.04       # per year, as fraction of total CAPEX
  overhead_frac: 0.20          # general overhead, as fraction of (variable + labour + maintenance)
  discount_rate: 0.08          # for the capital recovery factor
  plant_lifetime: 20.0         # yr

# Cradle-to-gate life-cycle inventory characterization factors.
lcia:
  elec_gwp: 0.35        # kg CO2-eq / kWh   (grid electricity)
  elec_ced: 9.5         # MJ / kWh          (cumulative/primary energy)
  elec_water: 0.002     # m3 / kWh
  heat_gwp: 0.066       # kg CO2-eq / MJ    (natural-gas heat)
  heat_ced: 1.15        # MJ / MJ
  nitrogen_gwp: 8.0     # kg CO2-eq / kg N  (mineral N fertilizer production)
  nitrogen_ced: 45.0    # MJ / kg N
  phosphorus_gwp: 2.0   # kg CO2-eq / kg P
  phosphorus_ced: 25.0  # MJ / kg P
  co2_supply_gwp: 0.10  # kg CO2-eq / kg CO2 supplied (capture/compression burden)
  substrate_gwp: 0.75   # kg CO2-eq / kg glucose
  substrate_ced: 12.0   # MJ / kg glucose
  bicarbonate_gwp: 0.87 # kg CO2-eq / kg NaHCO3 (ecoinvent "market for sodium bicarbonate" ~0.87; range 0.4 natural trona - 1.3 Solvay)
  bicarbonate_ced: 11.0 # MJ / kg NaHCO3 (soda-ash 12-18; NaHCO3 ~10-14)
  count_biogenic_uptake: true   # credit the CO2 fixed into biomass at the gate (CO2-fed phototrophic only)
