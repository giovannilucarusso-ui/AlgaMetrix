    25.45% at USD 0.5/kg, free fatty acids 7.57% at USD 2/kg, polar lipids 6.36% at USD 7/kg;
    beta-carotene is 4.80% and carries 74% of revenue at USD 350/kg."
  assumptions_required:
    - "Endpoint read from the source: SuperPro unit production cost, annual operating cost over
       the beta-carotene rate. Facility-dependent cost carries depreciation, so the figure is a
       cash-cost-plus-depreciation endpoint and not a minimum selling price."
    - "The source reports Net Unit Production Cost equal to Unit Production Cost, so the
       co-product revenues in Table 5 are listed and not credited against the cost. Recorded as
       coproduct_treatment: none rather than revenue_credit for that reason."
    - "Dry-algae throughput near 3,540 t/yr follows from dividing the published beta-carotene
       rate by the published 4.80% yield on recovered algae dry solids. It is a derivation of
       this dataset, not a figure the source prints, and is not used as a reported value."
  todos:
    - "Reconstruct as a scenario once the engine can fractionate one biomass into five priced
       streams: today it allocates across co-products but does not model a sequential solvent
