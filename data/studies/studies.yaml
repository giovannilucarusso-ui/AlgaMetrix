# =====================================================================
# AlgaMetrix study-evidence dataset
# =====================================================================
# One record per published estimate used anywhere in the methods paper.
# Schema and controlled vocabularies: src/algametrix/paper/schema.py
# Selection process and honest limitations: docs/STUDY_SELECTION.md
#
# CONVENTIONS
#   * A field that is absent or `null` means UNKNOWN. It is never silently
#     replaced by a default. Reports print it as "unknown".
#   * `assumptions_required` lists what had to be assumed to use the record.
#   * `todos` lists source information that must be extracted from the paper
#     before the record can enter analyses that need it.
#   * `reconstruction_builder` names a callable in
#     src/algametrix/paper/reconstructions.py. Without one, a study
#     cannot be executed by the engine no matter what tier it claims.
#
# PROVENANCE OF THIS FILE
#   Transcribed from paper_handoff/DATASET.md (the citation-ready table that
#   accompanied the manuscript draft) plus the price years and currencies
#   recovered from the committed legacy output results/harmonization.txt.
#   Fields that neither source records are `null`, not guessed.
#
#   IMPORTANT: the module that originally held this dataset
#   (`reference_studies.STUDIES`, referenced by DATASET.md) lives only on the
#   feature branch `m2-harmonization` (PR #1), which was never merged into main,
#   although its OUTPUTS were copied onto main as files. This file re-establishes
#   the dataset as versioned data on main, and the scenario builders it points at
#   are ported from that branch.
# =====================================================================

meta:
  dataset_version: "2.0"
  description: >
    Curated evidence set of microalgal / cyanobacterial / thraustochytrid
    production-cost and cradle-to-gate GWP estimates. NOT a systematic review:
    see docs/STUDY_SELECTION.md for what is and is not known about how these
    studies were found.
  is_systematic_search: false
  search_sources: unknown
  search_period: unknown
  search_strings: unknown
  date_compiled: unknown

studies:

# =====================================================================
# Tier B (declared) - studies the engine is meant to rebuild
# =====================================================================

