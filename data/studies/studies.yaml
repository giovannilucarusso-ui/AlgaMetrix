# --- Vazquez-Romero et al. 2022 (Sci. Total Environ.) ------------------------
# Added in the second revision to widen the matched reconstructable cohort,
# which rested on two external primary studies, one self-citation and one
# benchmark with no primary source. This paper is CC-BY and its supplementary
# material publishes the complete financial convention (Lang factors,
# depreciation, interest, maintenance, overheads) and every input price, so both
# cases are reconstructed BLIND: the engine is given the physical data and the
# accounting rules, never the reported biomass cost.
#
# Independence: a different publication, facility, country, strain and reactor
# system from `vazquez2022`, but the same first author. Disclosed rather than
# counted as a fully independent group.
- study_id: vazquez2022b_nas
  author_overlap_with_algametrix: false
  full_citation: "Vazquez-Romero et al. 2022, Science of the Total Environment 837:155742"
  doi: 10.1016/j.scitotenv.2022.155742
  publication_year: 2022
  search_source: "targeted search for open-access microalgae TEAs with a published cost breakdown"
  date_identified: "2026-08-02"
  data_location_in_source: "Supplementary Table 9, case 1b; parameters in Supplementary Tables 1, 3, 4, 5, 7"
  eligibility_status: included
  eligibility_reason: "Industrial-scale TEA reporting a production cost per kg dry biomass, with the full cost model published under CC-BY."
  study_type: tea
  organism: Nannochloropsis oceanica
  cultivation_system: stacked tubular PBR
  trophic_mode: phototrophic
  technology_scale: "1 ha, 27.61 t/yr"
  plant_maturity: commercial
  geographical_context: "Olhao, Portugal"
  functional_unit: 1 kg dry biomass
  system_boundary: "cultivation + harvesting (centrifugation) + drying (freeze-drying), cradle to gate"
  economic_endpoint_type: production_cost
  includes_depreciation: true
  includes_return_on_capital: false
  discount_rate_embedded: null
  includes_working_capital: false
  includes_startup_cost: false
  includes_coproduct_credit: false
  coproduct_treatment: none
  allocation_method: none
  reported_value: 53.32
  reported_unit: EUR/kg dry biomass
  reported_currency: EUR
  reported_price_year: 2021
  nominal_or_real: nominal
  environmental_endpoint_type: none
  published_gwp_available: false
  gwp_analysis_class: model_derived_gwp_from_tea_scenario
  reconstructability_tier: B
  validation_mode: blind
  reconstruction_builder: vazquez2022b_nas
  reconstruction_status: reproduced
  published_inventory_available: true
  published_capex_available: true
  published_opex_available: true
  cost_breakdown:
    capital_annualised: 0.4074
    maintenance: 0.0690
    labour: 0.1250
    electricity: 0.0745
    overhead: 0.1067
    other_opex: 0.2174
  assumptions_required:
    - "Interest on capital (8% of depreciation), property tax and insurance are
       summed into the engine's single non-depreciation capital charge; the
       composition is recorded in paper/reconstructions.py."
    - "The paper applies overheads to (labour + maintenance); the engine applies
       overhead_frac to (raw materials + utilities + labour). The published rate
       of 0.55 is used unchanged, so the two differ by their base."
    - "Nutrients are priced with the paper's own urea and triple-superphosphate
       prices (its case 4a). Cases 1a/1b actually buy a commercial nutrient
       solution, whose consumption is not published; the paper's own case 3a-vs-4a
       comparison puts that premium at about 4.4 EUR/kg, which is the main known
       cause of the reconstruction's negative bias."
    - "Consumables, wastewater treatment, cooling water, operating supplies and
       contingencies are OPEX lines the engine cannot derive from a mass balance
       and are therefore absent from the reconstruction."
    - "Depreciation is included and no return on capital is embedded: the paper
       reports a cost, not a selling price (Supplementary Table 7)."
  todos:
    - "Split the published MEC across cultivation, harvesting and drying so the
       capital is not carried entirely on the cultivation line."

