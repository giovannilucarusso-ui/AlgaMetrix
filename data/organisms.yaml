# Organism / strain library.
#
# All fractions are mass fractions of ASH-FREE DRY WEIGHT unless noted.
# `carbon`, `nitrogen`, `phosphorus` are elemental mass fractions of DRY WEIGHT
# and drive the CO2 / nutrient demand in the mass balance.
#
# Values are literature-typical placeholders. EDIT with your own measured data
# and cite the source in `notes`. `group` is informational only.

- name: Chlorella vulgaris
  group: microalga
  protein: 0.50
  lipid: 0.20
  carbohydrate: 0.20
  ash: 0.10
  carbon: 0.50
  nitrogen: 0.08
  phosphorus: 0.011
  notes: "Robust freshwater green microalga; common protein/feed reference strain."

- name: Arthrospira platensis (Spirulina)
  group: cyanobacterium
  protein: 0.62
  lipid: 0.08
  carbohydrate: 0.18
  ash: 0.12
  carbon: 0.46
  nitrogen: 0.10
  phosphorus: 0.012
  phycocyanin: 0.11   # C-phycocyanin, fraction of DW (theoretical ~11%; up to 15-20%). Subset of protein.
  notes: "Filamentous cyanobacterium; high protein; grown at high pH/alkalinity (easy harvest). C-phycocyanin is the high-value blue pigment (a subset of the protein pool)."

