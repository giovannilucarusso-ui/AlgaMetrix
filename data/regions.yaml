# Regional electricity values offered by the desktop guided setup.
#
# Picking a region in the setup sets two scenario inputs:
#   * economics.electricity_price - EUR per kWh, charged by the TEA;
#   * lcia.elec_gwp               - kg CO2-eq per kWh, applied by the LCA.
# Each value carries its source, reference year, geography and a quality flag,
# with the same meaning as in lcia.yaml:
#   sourced - the value the cited source reports (units converted, rounded)
#   derived - computed from the cited source, with the arithmetic in `source`
# A region with no national price statistic has `price: null` and a
# `price_note`; the setup then sets the grid factor only and leaves the price
# as it is.
#
# No result of the paper uses these values. They are here so that a user who
# picks a country starts from a traceable number instead of a placeholder.
# tests/test_regions.py refuses a value without a source.

reference_year: 2025
accessed: 2026-10-26

price:
  unit: EUR/kWh
  scope: >
    Non-household consumer price, excluding VAT and other recoverable taxes and
    levies. Where the source reports consumption bands, the band is
    2,000-19,999 MWh a year (Eurostat band ID). Eurostat publishes half-year
    prices; the annual value is the mean of the two halves of 2025. Prices
    outside the euro area are converted at the ECB annual average reference
    rate for 2025: 1.12998 USD and 0.85679 GBP per EUR.

grid:
  unit: kg CO2-eq/kWh
  scope: >
    Life-cycle greenhouse-gas intensity of the electricity generated in the
    region, all greenhouse gases, with upstream, supply-chain and manufacturing
    stages included. It is generation-based, so imports, exports and grid losses
    are not counted, and it is an annual average, not a marginal factor. The
    shipped default in lcia.yaml (0.35, EU-27, 2019-2021) has a different
    vintage and is not one of these values.
  source: >
    Ember (2026), Yearly Electricity Data and Yearly Electricity Data Europe,
    life-cycle carbon intensity of electricity generation, 2025, as published by
    Our World in Data (series co2_intensity__gco2_kwh, updated 2026-06-30);
    converted from g to kg and rounded to 0.1 g.

regions:
  - name: European Union (EU-27)
    price:
      value: 0.1618
      year: 2025
      geography: EU-27
      quality: derived
      source: >
        Eurostat nrg_pc_205, band ID, excluding VAT and other recoverable taxes
        and levies: mean of 2025-S1 (0.1640) and 2025-S2 (0.1596).
    grid:
      value: 0.2099
      year: 2025
      geography: EU-27
      quality: sourced
      source: Ember (2026), 209.9 g CO2-eq/kWh.

  - name: Italy
    price:
      value: 0.1989
      year: 2025
      geography: Italy
      quality: derived
      source: >
        Eurostat nrg_pc_205, band ID, excluding VAT and other recoverable taxes
        and levies: mean of 2025-S1 (0.2030) and 2025-S2 (0.1948).
    grid:
      value: 0.2848
      year: 2025
      geography: Italy
      quality: sourced
      source: Ember (2026), 284.8 g CO2-eq/kWh.

  - name: Spain
