name: windows-build

# A researcher who does not use Python cannot install this tool from a source
# tarball. This workflow produces the thing they can actually download: a
# self-contained Windows folder, smoke-tested before it is published, with a
# checksum so what arrives can be compared with what was built.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - "AlgaMetrix.spec"
      - "desktop/**"
      - "run_desktop.py"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the desktop client and the build tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the test suite
        # Nothing ships that the tests have not passed. The desktop and wizard
        # tests need a Qt platform; off-screen is the one a runner has.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

      - name: Build the executable
        run: pyinstaller --noconfirm --clean AlgaMetrix.spec

      - name: Smoke-test the executable
        # Start the built application, construct the whole window, run the engine
        # once and read the exit code. A build that imports but cannot compute
        # fails here rather than in the hands of whoever downloaded it. The exe is
        # windowed, so it has no console to print to: -Wait -PassThru gets the
        # exit code and the report goes to a file.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = "dist\AlgaMetrix\AlgaMetrix.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller produced no executable" }
          $p = Start-Process -FilePath $exe `
               -ArgumentList "--self-test","--self-test-out","$PWD\smoke-windows.txt" `
               -Wait -PassThru
          if (Test-Path smoke-windows.txt) { Get-Content smoke-windows.txt }
          if ($p.ExitCode -ne 0) { throw "the executable failed its self-test" }

      - name: Package and checksum
        # The checksum and the start-up report carry the platform in their names.
        # A release now holds a Windows build and two macOS builds, and three
        # files called SHA256SUMS.txt would overwrite each other on the way up.
        run: |
          Compress-Archive -Path dist\AlgaMetrix\* -DestinationPath AlgaMetrix-windows.zip
          $hash = (Get-FileHash AlgaMetrix-windows.zip -Algorithm SHA256).Hash
          "$hash  AlgaMetrix-windows.zip" | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: AlgaMetrix-windows
          path: |
            AlgaMetrix-windows.zip
            SHA256SUMS-windows.txt
            smoke-windows.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # smoke-windows.txt goes out with the build it describes: it is the output of
          # the start-up test that ran against this exact executable, and a
          # reader who wants to know whether the thing they downloaded was
          # checked should not have to dig through a workflow log to find out.
          files: |
            AlgaMetrix-windows.zip
            SHA256SUMS-windows.txt
            smoke-windows.txt
