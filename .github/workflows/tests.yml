name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match `requires-python` in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the engine and its test dependencies
        run: |
          python -m pip install --upgrade pip
          # Engine only: the desktop UI (PySide6) is not needed to run the
          # tests and pulls a large wheel. openpyxl is required by the
          # spreadsheet-export test, matplotlib by the PDF-report module that
          # tests/test_report.py imports, and scipy by the Sobol' sampler in the
          # evidence layer (the `paper` extra).
          python -m pip install numpy pandas PyYAML openpyxl matplotlib scipy pytest

      - name: Run the test suite
        # Includes the shared-inventory consistency check and the independent
        # matrix-LCA benchmark, both run over the full scenario suite. The
        # Brightway cross-check is skipped here by design: bw2calc pulls in
        # around thirty packages the engine does not need, so it runs from
        # scripts/brightway_crosscheck.py in its own environment.
        run: python -m pytest tests -q

      - name: Smoke-test the bundled examples
        # Every example builds a scenario and prints a full TEA/LCA result, so
        # running them exercises the engine end to end on real configurations.
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            python "$f" > /dev/null
          done

      - name: Smoke-test the reproduction pipeline
        # The validation numbers in docs/VALIDATION.md come out of this script.
        # --quick shrinks the stochastic stages; the deterministic ones, which
        # include every reproduction and every balance check, run in full.
        run: python reproduce.py --quick

  install:
    # The engine is meant to be usable after a plain `pip install`, so prove it
    # on a clean runner: the YAML data library must ship inside the wheel and
    # the documented entry point must resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from the built distribution only
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl

      - name: Load the shipped library from outside the source tree
        working-directory: /tmp
        run: |
          python -c "
          from algametrix.library import load_library
          from algametrix.models import Scenario
          from algametrix.scenario import run_scenario
          lib = load_library()
          scn = Scenario(
              organism=lib.organisms['Chlorella vulgaris'],
              system=lib.systems['Open raceway pond'],
              harvesting=lib.harvesting['Settling + centrifugation'],
              drying=lib.drying['Spray drying'],
              economics=lib.economics, lcia=lib.lcia, scale=100_000,
          )
          r = run_scenario(scn)
          print('cost', r.tea.production_cost_eur_per_kg)
          print('gwp ', r.lca.gwp_kg_co2eq_per_kg)
          "

      - name: The console entry point must resolve
        working-directory: /tmp
        # `desktop.app` imports PySide6, which this job deliberately does not
        # install, so check that the module the entry point names is present
        # rather than importing it.
        run: |
          python -c "
          import importlib.util as u
          import desktop, desktop.flowsheet
          assert u.find_spec('desktop.app') is not None, 'desktop.app was not installed'
          print('entry point target desktop.app:main is installed')
          "
