name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match `requires-python` in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the engine and its test dependencies
        run: |
          python -m pip install --upgrade pip
          # Engine only: the desktop UI (PySide6) is not needed to run the
          # tests and pulls a large wheel. openpyxl is required by the
          # spreadsheet-export test, and matplotlib by the PDF-report module
          # that tests/test_report.py imports.
          python -m pip install numpy pandas PyYAML openpyxl matplotlib pytest

      - name: Run the test suite
        run: python -m pytest tests -q

      - name: Smoke-test the bundled examples
        # Every example builds a scenario and prints a full TEA/LCA result, so
        # running them exercises the engine end to end on real configurations.
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            python "$f" > /dev/null
          done
