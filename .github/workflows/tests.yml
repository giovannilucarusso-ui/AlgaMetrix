name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must match `requires-python` in pyproject.toml.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the engine and its test dependencies
        run: |
          python -m pip install --upgrade pip
          # Engine only: the desktop UI (PySide6) is not needed by these tests
          # and pulls a large wheel, so the desktop and wizard tests skip
          # themselves here and run in the `desktop` job below. openpyxl is
          # required by the spreadsheet-export test and scipy by the Sobol'
          # sampler in the evidence layer.
          pip install -r requirements-paper.txt openpyxl pytest

      - name: Run the test suite
        # Includes the shared-inventory consistency check and the independent
        # matrix-LCA benchmark, both run over the full scenario suite. The
        # Brightway cross-check is skipped here by design: bw2calc pulls in
        # around thirty packages the engine does not need, so it runs from
        # scripts/brightway_crosscheck.py in its own environment.
        run: python -m pytest tests -q

      - name: Smoke-test the bundled examples
        # Every example builds a scenario and prints a full TEA/LCA result, so
        # running them exercises the engine end to end on real configurations.
        run: |
          for f in examples/*.py; do
            echo "--- $f"
            python "$f" > /dev/null
          done

      - name: Smoke-test the reproduction pipeline
        # The validation numbers in docs/VALIDATION.md come out of this script.
        # --quick shrinks the stochastic stages; the deterministic ones, which
        # include every reproduction and every balance check, run in full.
        run: python reproduce.py --quick

  install:
    # The engine is meant to be usable after a plain `pip install`, so prove it
    # on a clean runner: the YAML data library must ship inside the wheel and
    # the documented entry point must resolve.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install from the built distribution only
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl

      - name: Load the shipped library from outside the source tree
        working-directory: /tmp
        run: |
          python -c "
          from algametrix.library import load_library
          from algametrix.models import Scenario
          from algametrix.scenario import run_scenario
          lib = load_library()
          scn = Scenario(
              organism=lib.organisms['Chlorella vulgaris'],
              system=lib.systems['Open raceway pond'],
              harvesting=lib.harvesting['Settling + centrifugation'],
              drying=lib.drying['Spray drying'],
              economics=lib.economics, lcia=lib.lcia, scale=100_000,
          )
          r = run_scenario(scn)
          print('cost', r.tea.production_cost_eur_per_kg)
          print('gwp ', r.lca.gwp_kg_co2eq_per_kg)
          "

      - name: The console entry point must run, and say what it needs
        working-directory: /tmp
        # Actually execute the installed command. Without the desktop extra it
        # must exit non-zero with an instruction the reader can follow - not a
        # ModuleNotFoundError traceback, and not a check that merely proves the
        # module is importable, which is what this step used to do and why the
        # broken command shipped.
        run: |
          set +e
          output=$(algametrix 2>&1)
          status=$?
          set -e
          echo "$output"
          test $status -ne 0 || { echo "the command should have failed without PySide6"; exit 1; }
          echo "$output" | grep -q 'algametrix\[desktop\]' \
            || { echo "the failure did not name the install command"; exit 1; }

  desktop:
    # The Qt client and the setup wizard have their own tests, and they only run
    # where Qt can start. Off-screen on a runner is enough to build every widget,
    # drive the signals and check what the window hands the engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt's system libraries
        # PySide6's wheel does not carry these, and importing it without them
        # fails with 'libEGL.so.1: cannot open shared object file'.
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
                                  libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
                                  libxcb-shape0

      - name: Install the desktop client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run the desktop and wizard tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/test_desktop_window.py tests/test_wizard.py -q

      - name: The application must start and compute its default case
        # The same self-test the Windows build runs on the packaged executable.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run_desktop.py --self-test

      - name: The desktop extra must make the console command work
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          pip install ".[desktop]"
          algametrix --self-test
