[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "algametrix"
version = "0.1.0"
description = "Open-source techno-economic analysis and LCA for microalgae and aquatic protist biomass"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Giovanni Luca Russo" }]
keywords = ["microalgae", "thraustochytrid", "TEA", "LCA", "bioeconomy", "biomass", "sustainability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6", "matplotlib>=3.8", "openpyxl>=3.1"]
web = ["streamlit>=1.36", "plotly>=5.22"]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
algametrix = "desktop.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"algametrix" = ["../../data/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
